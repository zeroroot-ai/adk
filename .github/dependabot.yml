# Dependabot config. It follows templates/dependabot.yml of zeroroot-ai/.github.
# A patch or minor update is in one group and merges alone on a green merge
# gate. A major update opens alone and waits for a person (D44).

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/gibson"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    ignore:
      # grpc 1.84.0 has GO-2026-6443 (a server panic through a missing
      # authority or Host header), and no 1.84.x release holds the fix.
      # 1.83.2 is fixed. Remove this entry when a fixed release above 1.83.2
      # exists: Dependabot then proposes it.
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.0"]
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      # The sub-actions of codeql-action must move together, also for a major
      # update.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

