# Calls the org-level reusable architectural-doc-coverage workflow.
# See zeroroot-ai/.github/.github/workflows/architectural-doc-coverage.yml
# for the gate's logic, configuration, and rationale.
#
# Required check name: architectural-doc-coverage

name: architectural-doc-coverage

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # The called reusable declares `pull-requests: read` (it runs `gh pr view`
  # to verify the Docs-PR). A caller grants at least what the callee declares,
  # or GitHub refuses the call at startup: "requesting 'pull-requests: read',
  # but is only allowed 'pull-requests: none'".
  pull-requests: read

jobs:
  architectural-doc-coverage:
    uses: zeroroot-ai/.github/.github/workflows/architectural-doc-coverage.yml@f760edb01410e83c4e262218b80f64d939fe80f3 # main, 2026-09-07: .github#22 go toolchain guard
    secrets:
      DOCS_REPO_READ_TOKEN: ${{ secrets.DOCS_REPO_READ_TOKEN }}
