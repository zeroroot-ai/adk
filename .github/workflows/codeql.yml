name: CodeQL

# The scan is the shared workflow of zeroroot-ai/.github (ADR-0018, D38). It
# runs the suite security-extended and the custom Go queries of the
# organization. This repo keeps no CodeQL config file and sets the triggers
# only (adk#156).
#
# The scan runs on a push to main, not on merge_group. codeql-action uploads
# the result against github.ref, and GitHub deletes the merge-queue ref before
# the analysis ends (adk#206).
#
# The check name is `CodeQL / CodeQL (go)`. No ruleset requires it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@4bf8d348295c9a501b97cc2ffbdc0873c285b6f2 # v0.21.1
    with:
      languages: '["go"]'
      # The Go module is under gibson/, not at the repo root.
      go-version-file: gibson/go.mod
      go-build-command: cd gibson && go build ./...
      paths-ignore: |
        **/*.pb.go
        **/testdata/**
