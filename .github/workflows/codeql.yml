name: CodeQL

# Epic: cicd-efficiency (board #44), slice S11b. Scanner cadence per
# docs/architecture/CICD-CONTEXT.md decision #9 originally chose merge_group
# (the pre-merge gate) over push:main, plus the existing weekly deep scan.
#
# adk#206: that never actually worked. codeql-action/analyze uploads SARIF
# against github.ref, which for a merge_group run is the ephemeral
# refs/heads/gh-readonly-queue/main/pr-N-<sha> ref -- deleted by GitHub as
# soon as the queue entry resolves, usually before the analysis finishes.
# Confirmed 5/5 recent merge_group runs fail with "ref ... not found".
# CodeQL isn't in adk-required-checks' required status checks (only
# policy-guards/vault-auth-method-deny-list is), so this was silent: only
# the weekly cron ever landed an analysis on main. Same class of bug hit
# gibson-executor#345 and sdk#477 -- all three repos share this template.
#
# Fix: trigger on push:main instead. main persists, so uploads succeed on
# every merge -- better cadence than the broken merge_group trigger, no
# double-fire versus decision #9's original concern (one analyze run per
# merge either way). adk is public, so security-events:write + SARIF
# upload to the code-scanning Security tab stays as-is (no paid GHAS
# requirement, unlike gibson's private-repo workaround).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 2"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gibson/go.mod
          cache: true
          cache-dependency-path: gibson/go.sum

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          queries: security-extended

      - name: Build
        run: cd gibson && go build ./...

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
