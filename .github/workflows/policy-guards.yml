# Epic: cicd-efficiency (board #44), slice S11b. Consolidates adk's trivial
# per-PR policy guard into a single job
# ("trivial guards ...
# consolidated into one policy-guards job"). Runs on both pull_request (fast
# contributor signal) and merge_group (the authoritative gate) --
# pr-title-lint.yml stays separate and pull_request-only since PR-title
# checks are meaningless in the merge queue context.
#
# Currently folds in:
#   - vault-auth-method-deny-list (ADR-0009, org-level reusable workflow;
#     formerly its own vault-auth-method-deny-list.yml)
#
# adk has no other standalone trivial guard workflows today.
#
# Required check name: policy-guards / vault-auth-method-deny-list (matches
# gibson's canary, verified under merge_group org-wide in gibson PR #208).
# Do not rename the job id.

name: policy-guards

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  policy-guards:
    name: policy-guards
    uses: zeroroot-ai/.github/.github/workflows/vault-auth-method-deny-list.yml@7626d9726b593f0e33bc668626e0dbe8771eee19 # v0.20.1
