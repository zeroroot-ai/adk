name: go-ci

# Thin caller for the canonical three-tier Go CI (Epic: cicd-efficiency, board
# #44, slice S11b). See docs/architecture/CICD-CONTEXT.md and
# docs/adr/0060-ci-runner-split-hosted-default-ephemeral-metal.md.
#
# Replaces the previous single ci.yml, which double-fired build/fmt/vet/test
# (including `-race`) on both `pull_request` and `push:main`. This file
# follows the org-wide trigger split instead:
#
#   pull_request -> fast tier:   quick contributor signal (mod-tidy drift,
#                                vet, build, test -- no race).
#   merge_group  -> heavy tier:  authoritative gate (race + govulncheck via
#                                the reusable).
#
# adk's module lives at gibson/go.mod (module github.com/zeroroot-ai/adk/gibson),
# NOT at the repo root -- go-mod-path: gibson everywhere below.
#
# The module cache hid this for a while. setup-go keys its cache on go.sum, so
# the break only surfaced when the sdk pin moved to v0.177.0 (#251) and the
# cache missed. Every job below now configures the same credential.
#
# INTENTIONAL TIER CHANGE: today's ci.yml runs `go test -race ./...` on every
# pull_request. That moves here to the reusable's `heavy` tier, which only
# runs on merge_group. This is the same trigger-split every other repo in
# this epic slice adopts (mirrors gibson's go-ci.yml) -- race detection
# becomes the merge_group-authoritative signal instead of a per-PR one. Not a
# silent regression: called out explicitly in the PR body.
#
# gibson's own `make check-fmt` is not a step the reusable knows about, so it
# stays a small native job on pull_request.
#
# lint stays native (golangci-lint-action@v9, install-mode: goinstall,
# --new-from-rev diff scoping) instead of delegating to the reusable's
# built-in golangci-lint step (skip-lint: true passed below): the reusable
# pins golangci-lint-action to a fixed version that can silently diverge from
# this repo's action-pinned version and Go toolchain -- the same "v2 trap"
# gibson was already bitten by once (sdk#355/adk#154).
#
# check-cue-fresh and deadcode are both repo-specific static drift/reachability
# gates the reusable has no notion of (multi-repo checkout + cue install;
# whole-program deadcode analysis) -- kept native, unchanged, on pull_request.
#
# no-monorepo-shortcuts is a reusable call with no build/test surface of its
# own; pinned to pull_request only here (see PR body for the merge_group
# scoping rationale).

on:
  pull_request:
  merge_group:

concurrency:
  group: go-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- fast tier (pull_request): reusable mod-tidy/vet/build/test ----
  fast:
    if: github.event_name == 'pull_request'
    uses: zeroroot-ai/.github/.github/workflows/reusable-go-ci.yml@40c67fd77152f2c4924abccbd992dbca065f325b # v0.8.2
    with:
      tier: fast
      go-mod-path: gibson
      skip-lint: true # adk runs its own pinned golangci-lint below (lint job)

  # ---- heavy tier (merge_group): reusable race + govulncheck ----
  heavy:
    if: github.event_name == 'merge_group'
    uses: zeroroot-ai/.github/.github/workflows/reusable-go-ci.yml@40c67fd77152f2c4924abccbd992dbca065f325b # v0.8.2
    with:
      tier: heavy
      go-mod-path: gibson

  # ---- gofmt gate (fast tier / pull_request) ----
  # Not covered by the reusable; cheap enough to run as its own small job.
  check-fmt:
    if: github.event_name == 'pull_request'
    name: check-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: gibson
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gibson/go.mod
          cache: true
          cache-dependency-path: gibson/go.sum

      - name: Fmt
        run: make check-fmt

  # check-cue-fresh: drift gate for the embedded mission CUE schema.
  # Mirrors the dashboard's check-mission-schema-fresh pattern. Fails
  # when gibson/cmd/gibson/cmd/mission/schema/.../mission_definition_proto_gen.cue
  # has drifted from the SDK proto.
  #
  # Runs in FULL mode here because we explicitly check out the SDK
  # sibling repository alongside this one -- same workspace layout the
  # script expects on a developer's workstation
  # (~/Code/zeroroot.ai/opensource/{adk,sdk}). The SDK is checked out
  # without history (depth: 1) and at its default branch, which is the
  # right answer for a drift gate: drift is defined against the
  # current SDK main, the same surface every customer-installed CLI
  # will eventually consume.
  #
  # Spec: zeroroot-ai/adk#27 (mission-author-experience epic, M3). Kept
  # native and unchanged -- the reusable has no notion of multi-repo
  # checkouts.
  check-cue-fresh:
    if: github.event_name == 'pull_request'
    name: check-cue-fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: adk
    steps:
      - name: Checkout adk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: adk

      # sdk is private: the default GITHUB_TOKEN is scoped to adk only and
      # this checkout answers "Not Found" without a cross-repo token.
      - name: Checkout sdk (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zeroroot-ai/sdk
          path: sdk

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: adk/gibson/go.mod
          cache: true
          cache-dependency-path: adk/gibson/go.sum

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.16.1

      - name: Prime buf protovalidate cache (SDK dep)
        working-directory: sdk
        run: |
          # The cue import proto pipeline reads protovalidate's .proto files
          # from buf's module cache; `buf dep update` populates that cache
          # against the SDK's buf.yaml/buf.lock without generating any code.
          # buf is pinned as a go.mod `tool` dependency in the SDK, so
          # `go tool buf` is hermetic and npm-free (SDK Makefile: `BUF := go
          # tool buf`). The old `npm ci` assumed a package.json the SDK does
          # not ship and failed at setup on every PR (adk#185).
          go tool buf dep update

      - name: Run check-cue-fresh
        run: make check-cue-fresh

  # lint: diff-scoped golangci-lint. BLOCKING on issues a PR introduces
  # (--new-from-rev), while the pre-existing backlog is burned down under
  # adk#160. golangci-lint is built from the repo-pinned toolchain
  # (gibson/go.mod => go 1.26.6) so it can analyze go1.26 source; the action
  # handles version resolution + caching. Quality bar §3. Kept native --
  # see the "v2 trap" note at the top of this file.
  lint:
    if: github.event_name == 'pull_request'
    name: lint (new code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOLANGCI_LINT_VERSION: v2.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # golangci-lint --new-from-rev needs history back to the base.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gibson/go.mod
          cache: true
          cache-dependency-path: gibson/go.sum

      # golangci-lint is built from source with the runner's pinned Go
      # (from setup-go). The prebuilt release binary is compiled with an
      # older Go and refuses a config targeting a newer one ("Go language
      # version used to build golangci-lint is lower than the targeted Go
      # version"), so it must be compiled here.
      #
      # Compiling from source does NOT fix the other version problem, and it
      # is worth being explicit so nobody re-derives it: golangci-lint ships
      # its own importer (vendored x/tools), so whether it can read a
      # module's export data is set by GOLANGCI_LINT_VERSION, not by the Go
      # that compiles it. v2.4.0 rebuilt with go1.27.1 still fails with
      # "export data version 4 is greater than maximum supported version 2".
      # Keep the version at or above the Go floor in gibson/go.mod. That compile ran on EVERY
      # job and failed twice on 2026-09-28 with no output (runs 36422076889
      # and 36424344608), on PRs that changed no Go. Cache the built binary,
      # keyed on the linter version and go.mod's `go` directive, the two
      # inputs that decide what gets built, so the compile runs only when
      # one of them moves.
      - name: Restore the golangci-lint binary
        id: golangci-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('gibson/go.mod') }}

      - name: Build golangci-lint with the pinned Go
        if: steps.golangci-bin.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: golangci-lint (new issues only)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: gibson
          # The binary comes from the cache or the build step above.
          install-mode: none
          # Gate only the diff vs the PR base so new code is held to the
          # full linter set without red-walling on the backlog (adk#160).
          args: --new-from-rev=${{ github.event.pull_request.base.sha || 'HEAD~1' }} --timeout=8m

  # deadcode: BLOCKING whole-program reachability gate (x/tools deadcode),
  # minus the allowlisted pre-existing backlog (scripts/deadcode-allow.txt,
  # adk#159). Fails on any NEW unreachable function. Quality bar §3. Kept
  # native -- the reusable has no notion of whole-program deadcode analysis.
  deadcode:
    if: github.event_name == 'pull_request'
    name: deadcode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adk
    steps:
      - name: Checkout adk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: adk

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: adk/gibson/go.mod
          cache: true
          cache-dependency-path: adk/gibson/go.sum

      # Installed through the Makefile so CI and `make bootstrap` cannot run
      # different versions. DEADCODE_VERSION in the Makefile is the one pin.
      - name: Install deadcode (pinned via the Makefile)
        run: make deadcode-install

      # Mutation-test the gate BEFORE trusting it. The gate used to report a
      # clean run when deadcode had analysed nothing, so the fixture's required
      # red cases are the ways it must fail — including an analysis that errors
      # with empty stdout, which is indistinguishable from "no dead code" to a
      # gate that reads stdout only.
      - name: Mutation-test the deadcode gate
        run: bash scripts/__tests__/deadcode-gate.test.sh

      - name: Run deadcode gate
        run: make deadcode

  # no-monorepo-shortcuts has no build/test surface of its own -- explicitly
  # scoped to pull_request only so it doesn't also fire (wastefully, or
  # erroneously if it assumes PR-only context) on merge_group. No evidence
  # in the org reusable or its callers elsewhere in the epic that it needs
  # to also gate merge_group; default conservative choice per the parent
  # task brief.
  no-monorepo-shortcuts:
    if: github.event_name == 'pull_request'
    uses: zeroroot-ai/.github/.github/workflows/no-monorepo-shortcuts.yml@40c67fd77152f2c4924abccbd992dbca065f325b # v0.8.2

  # ---------------------------------------------------------------------------
  # templates-check — moved in from templates.yml so ci-required covers it.
  # ---------------------------------------------------------------------------
  # `needs:` cannot cross workflow files, so a gate in its own file cannot be
  # aggregated. It ran on every PR and blocked nothing. Moving it does NOT
  # rename its check run: a check run's context is the JOB name, so
  # `templates-check` stays `templates-check`.
  #
  # It lost `push: main` and `workflow_dispatch` in the move. Neither was a
  # gate: merge_group is the authoritative pre-merge run (ADR-0060), and a
  # post-merge repeat of a PR gate reports after the decision is made.
  templates-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gibson/go.mod
          cache: true

      - name: Build CLI
        run: cd gibson && go build -o bin/gibson ./cmd/gibson

      - name: Diagnostic — build environment identity
        # Prints the knobs that determine protojson output stability so we
        # can compare local vs CI when whitespace parity issues resurface.
        # Root cause of adk#33: protojson/internal/detrand seeds from a hash
        # of the binary; different builds → different seeds → different spacing.
        # Fix is in render.go (compact marshal + json.Indent); this step
        # provides a paper trail if the problem ever recurs.
        run: |
          echo "=== go version ==="
          go version
          echo "=== GOTOOLCHAIN ==="
          go env GOTOOLCHAIN
          echo "=== GOMODCACHE ==="
          go env GOMODCACHE
          echo "=== GOPROXY ==="
          go env GOPROXY
          echo "=== protobuf sha in go.sum ==="
          grep "^google.golang.org/protobuf v1" gibson/go.sum
          echo "=== binary sha256 ==="
          sha256sum gibson/bin/gibson
          echo "=== first rendered template (first 20 lines) ==="
          ./gibson/bin/gibson mission render templates/recon/template.cue 2>&1 | head -20

      - name: Run templates-check
        # Builds the gibson CLI, then vets each template.cue through
        # `gibson mission validate` (schema-aware, single code path),
        # regenerates template.json via `gibson mission render`,
        # and asserts no drift.
        # Spec: mission-authoring-cue Requirement 9.
        run: make templates-check

  # ---------------------------------------------------------------------------
  # ci-required — THE single required status check for this repo.
  # ---------------------------------------------------------------------------
  # adk was the only one of setec / sdk / gibson-executor / adk WITHOUT an
  # aggregator. Measured in zeroroot-ai/.github rulesets/repo/*.json: the other
  # three require `ci-required`, and adk required exactly three contexts —
  # policy-guards, brand-guard and link-check. So fourteen checks ran and three
  # could stop a merge. `deadcode`, `fast / go-ci (fast)`, `lint (new code)`,
  # `check-fmt`, `check-cue-fresh` and `templates-check` could all report red and
  # the PR would still merge.
  #
  # `deadcode` is the sharpest case: adk#82 built it carefully, with a pinned
  # x/tools version, an assertion that the pinned binary is the one that ran, and
  # a mutation-tested fixture — and nothing required it to pass. The same class
  # already merged a red lint in gibson-executor#369 and a red validate in
  # deploy#1526.
  #
  # Widening the required LIST is not the fix: that list lives in a different
  # repo from the workflows it names, so it falls behind every time a gate is
  # added here. One job needs: every gate, and the ruleset requires that one job.
  # Adding a gate means adding it to needs: in the same PR, and
  # ci-required-selftest's coverage check fails when that is forgotten.
  #
  # if: always() is load-bearing. GitHub skips a needs: job when ANY dependency
  # is skipped, so without it the aggregator vanishes exactly when a gate was
  # skipped — and an ABSENT required context freezes merge-queue entry instead of
  # failing it. See scripts/ci-required-gate.sh for why the results must then be
  # read rather than assumed.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - fast
      - heavy
      - check-fmt
      - check-cue-fresh
      - lint
      - deadcode
      - no-monorepo-shortcuts
      - templates-check
      # The selftest is a dependency, not a bystander. ci-required is the one
      # thing standing between a red gate and main, so a regression in the
      # aggregation logic itself has to block too.
      - ci-required-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Evaluate every gate result
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: bash scripts/ci-required-gate.sh

  # ci-required-selftest proves the aggregation logic can fail, and that the
  # needs: list above covers every gate job in this file. A gate added without
  # being listed is the failure mode the coverage check exists for.
  ci-required-selftest:
    name: ci-required-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mutation-test the aggregation logic
        run: bash scripts/__tests__/ci-required-gate.test.sh

      - name: Every gate job is in ci-required's needs
        run: bash scripts/check-ci-required-coverage.sh .github/workflows/go-ci.yml
